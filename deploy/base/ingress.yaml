# The web app calls relative paths only, so this routing is the whole contract:
#   /api/polls  -> poll-service   (the service serves that prefix itself)
#   /api/qa     -> qa-service
#   /           -> web
#
# No rewrite rules: each service is mounted at its own prefix, so the path the
# browser sends is the path the service expects. One less thing to get wrong.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse
  labels:
    app.kubernetes.io/name: pulse
    app.kubernetes.io/part-of: pulse
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/polls
            pathType: Prefix
            backend:
              service:
                name: poll-service
                port:
                  name: http
          - path: /api/qa
            pathType: Prefix
            backend:
              service:
                name: qa-service
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
