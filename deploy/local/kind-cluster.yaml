# kind ships no ingress controller, so the control-plane node is labelled
# ingress-ready and publishes the HTTP ports that ingress-nginx binds to.
#
# Host ports are 18080/18443, deliberately high: 80, 443 and 8080-8084 are
# commonly taken by other local clusters, and a high port needs no elevation.
# Change them here and in scripts/dev.sh (INGRESS_HTTP_PORT) together.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pulse

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18080
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP
