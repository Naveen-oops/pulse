# Serves the built Docusaurus site under /docs. Unprivileged, so port 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"docs"}';
    }

    # Hashed assets are immutable.
    location /docs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /docs {
        return 301 /docs/;
    }

    # trailingSlash: false means Docusaurus emits page.html rather than
    # page/index.html, so try the .html form before giving up.
    location /docs/ {
        try_files $uri $uri.html $uri/index.html $uri/ /docs/404.html;
    }

    location / {
        return 301 /docs/;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
